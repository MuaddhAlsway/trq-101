<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>FORMA — Architecture Studio | React + GSAP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet"/>
<!-- FORMA Architecture Website — Built with React 18 + GSAP 3.12 + ScrollTrigger -->
<!-- Components: Loader, Nav, Hero, Marquee, Vision, Philosophy(Pinned), Projects, Stats, Process, Gallery, Contact, Footer -->
<!-- Animations: Cinematic loader, word reveals, scroll parallax, pinned scrub, clip-path reveals, magnetic buttons, custom cursor -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --black:#080807;--white:#f7f4ef;--cream:#eae5db;--stone:#bfb9aa;
  --mid:#7a7468;--dark:#161410;--accent:#c8a96e;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Helvetica Neue',Helvetica,Arial,sans-serif;
}
html{font-size:16px;scroll-behavior:auto}
body{background:var(--black);color:var(--white);font-family:var(--sans);font-weight:300;overflow-x:hidden;cursor:none}
#root{overflow-x:hidden}
#cur{position:fixed;width:9px;height:9px;background:var(--white);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);mix-blend-mode:difference;transition:width .4s,height .4s}
#cur-ring{position:fixed;width:38px;height:38px;border:1px solid rgba(247,244,239,.3);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%)}
.nav{position:fixed;top:0;left:0;right:0;z-index:200;padding:2.2rem 5rem;display:flex;align-items:center;justify-content:space-between;opacity:0}
.nav-logo{font-family:var(--serif);font-size:1.35rem;letter-spacing:.3em;text-transform:uppercase;color:var(--white);text-decoration:none;font-weight:400;mix-blend-mode:difference}
.nav-links{display:flex;gap:2.8rem;list-style:none}
.nav-links a{font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;color:var(--white);text-decoration:none;opacity:.6;transition:opacity .5s;mix-blend-mode:difference}
.nav-links a:hover{opacity:1}
.nav-cta{font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;color:var(--white);background:none;border:1px solid rgba(247,244,239,.3);padding:.6rem 1.6rem;cursor:none;transition:all .6s;mix-blend-mode:difference}
.nav-cta:hover{background:var(--white);color:var(--black)}
.loader{position:fixed;inset:0;background:var(--black);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5rem}
.loader-logo{font-family:var(--serif);font-size:2.2rem;letter-spacing:.5em;text-transform:uppercase;color:var(--white);opacity:0}
.loader-track{width:220px;height:1px;background:rgba(255,255,255,.12)}
.loader-fill{height:100%;background:var(--white);width:0;transform-origin:left}
.loader-num{font-size:.6rem;letter-spacing:.25em;color:var(--stone)}
.hero{position:relative;width:100%;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero-bg{position:absolute;inset:0;transform-origin:center}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,7,.1) 0%,rgba(8,8,7,.55) 100%)}
.hero-content{position:relative;z-index:2;text-align:center;max-width:1050px;padding:0 2rem}
.hero-eyebrow{font-size:.62rem;letter-spacing:.38em;text-transform:uppercase;color:var(--stone);margin-bottom:2.8rem;opacity:0;transform:translateY(18px)}
.hero-h1{font-family:var(--serif);font-size:clamp(5rem,10vw,11rem);font-weight:300;line-height:.9;letter-spacing:-.015em;margin-bottom:3rem}
.hero-line{display:block;overflow:hidden}
.hero-word{display:inline-block;transform:translateY(115%);opacity:0}
.hero-sub{font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;color:var(--stone);opacity:0;transform:translateY(20px)}
.hero-scroll{position:absolute;bottom:2.8rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.8rem;opacity:0;z-index:2}
.scroll-bar{width:1px;height:55px;background:linear-gradient(var(--stone),transparent);animation:sb 2.2s ease-in-out infinite}
@keyframes sb{0%{transform:scaleY(0);opacity:0;transform-origin:top}50%{opacity:1}100%{transform:scaleY(1);opacity:0;transform-origin:bottom}}
.scroll-txt{font-size:.55rem;letter-spacing:.28em;text-transform:uppercase;color:var(--stone)}
.marquee{padding:1.8rem 0;border-top:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.07);overflow:hidden;background:var(--black)}
.marquee-inner{display:flex;white-space:nowrap;will-change:transform}
.marquee-item{display:inline-flex;align-items:center;gap:2.8rem;padding:0 2.8rem;font-family:var(--serif);font-size:1rem;font-style:italic;color:var(--stone);flex-shrink:0}
.marquee-sep{width:3px;height:3px;border-radius:50%;background:var(--accent)}
.vision{min-height:100vh;background:var(--cream);color:var(--black);display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.vision-left{padding:9rem 5rem 9rem 6rem;display:flex;flex-direction:column;justify-content:center}
.vision-tag{font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--mid);margin-bottom:3rem;opacity:0;transform:translateY(18px)}
.vision-h2{font-family:var(--serif);font-size:clamp(3rem,5vw,5.5rem);font-weight:300;line-height:1.04;margin-bottom:3.5rem;overflow:hidden}
.vision-line{display:block;overflow:hidden}
.vision-word{display:inline-block;transform:translateY(105%)}
.vision-p{font-size:.9rem;line-height:1.9;color:var(--mid);max-width:400px;opacity:0;transform:translateY(22px)}
.vision-p+.vision-p{margin-top:1.4rem}
.vision-link{margin-top:3.5rem;display:inline-flex;align-items:center;gap:1.4rem;font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;color:var(--black);text-decoration:none;opacity:0;transform:translateY(18px)}
.vision-link-bar{width:36px;height:1px;background:var(--black);transition:width .9s cubic-bezier(.16,1,.3,1)}
.vision-link:hover .vision-link-bar{width:72px}
.vision-right{position:relative;overflow:hidden}
.vision-img-inner{position:absolute;inset:0;overflow:hidden}
.vision-curtain{position:absolute;inset:0;background:var(--cream);transform-origin:left;z-index:2}
.pin-wrap{height:280vh;position:relative}
.pin-sticky{position:sticky;top:0;height:100vh;background:var(--black);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pin-phase{position:absolute;text-align:center;max-width:820px;padding:2rem;opacity:0;transform:translateY(35px)}
.pin-num{font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:2rem}
.pin-title{font-family:var(--serif);font-size:clamp(2.8rem,5.5vw,6rem);font-weight:300;line-height:1.02;color:var(--white);margin-bottom:2rem}
.pin-body{font-size:.82rem;letter-spacing:.06em;color:var(--stone);line-height:1.95;max-width:460px;margin:0 auto}
.pin-dots{position:absolute;bottom:3.5rem;left:50%;transform:translateX(-50%);display:flex;gap:.9rem}
.pin-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.2);transition:background .6s,transform .4s}
.pin-dot.on{background:var(--white);transform:scale(1.3)}
.projects{background:var(--black);padding:9rem 0}
.proj-head{padding:0 6rem;margin-bottom:7rem}
.proj-tag{font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--stone);margin-bottom:2.2rem;opacity:0;transform:translateY(18px)}
.proj-h2{font-family:var(--serif);font-size:clamp(3rem,5vw,5.5rem);font-weight:300;color:var(--white);overflow:hidden}
.proj-line{display:block;overflow:hidden}
.proj-word{display:inline-block;transform:translateY(105%)}
.proj-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.proj-item{position:relative;overflow:hidden;cursor:none}
.proj-item:first-child{grid-row:span 2}
.proj-img-wrap{position:relative;overflow:hidden;height:100%;min-height:320px}
.proj-item:first-child .proj-img-wrap{min-height:660px}
.proj-img{width:100%;height:100%;object-fit:cover;transform:scale(1.06);transition:transform 2s cubic-bezier(.16,1,.3,1);display:block}
.proj-item:hover .proj-img{transform:scale(1.13)}
.proj-veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,8,7,.88) 0%,transparent 50%);opacity:0;transition:opacity 1s cubic-bezier(.16,1,.3,1)}
.proj-item:hover .proj-veil{opacity:1}
.proj-meta{position:absolute;bottom:0;left:0;right:0;padding:2.8rem;transform:translateY(16px);opacity:0;transition:all 1s cubic-bezier(.16,1,.3,1)}
.proj-item:hover .proj-meta{transform:translateY(0);opacity:1}
.proj-n{font-size:.58rem;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:.8rem}
.proj-title{font-family:var(--serif);font-size:2.1rem;font-weight:300;color:var(--white);margin-bottom:.45rem}
.proj-sub{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--stone)}
.proj-reveal{opacity:0;transform:translateY(55px)}
.stats{background:var(--dark);padding:7rem 6rem;display:grid;grid-template-columns:repeat(4,1fr);gap:4rem;border-top:1px solid rgba(255,255,255,.05)}
.stat{opacity:0;transform:translateY(28px)}
.stat-n{font-family:var(--serif);font-size:clamp(3.2rem,5vw,5.2rem);font-weight:300;color:var(--white);line-height:1;margin-bottom:1rem}
.stat-l{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--stone);line-height:1.75}
.process{background:var(--cream);color:var(--black);padding:9rem 6rem;overflow:hidden}
.proc-head{margin-bottom:6rem}
.proc-tag-row{display:flex;align-items:center;gap:1.8rem;margin-bottom:2.8rem;opacity:0;transform:translateY(18px)}
.proc-tag-line{width:36px;height:1px;background:var(--mid)}
.proc-tag{font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;color:var(--mid)}
.proc-h2{font-family:var(--serif);font-size:clamp(3rem,5vw,5.5rem);font-weight:300;line-height:1.04;overflow:hidden}
.proc-line{display:block;overflow:hidden}
.proc-word{display:inline-block;transform:translateY(105%)}
.proc-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:4.5rem;margin-top:5.5rem}
.step{opacity:0;transform:translateY(38px)}
.step-n{font-family:var(--serif);font-size:5rem;font-weight:300;color:var(--stone);line-height:1;margin-bottom:2rem;opacity:.35}
.step-t{font-family:var(--serif);font-size:1.5rem;font-weight:400;margin-bottom:1.2rem;color:var(--black)}
.step-b{font-size:.85rem;line-height:1.9;color:var(--mid)}
.gallery{background:var(--black);padding:7rem 0;overflow:hidden}
.gal-tag{padding:0 6rem;font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--stone);margin-bottom:3.5rem;opacity:0;transform:translateY(18px)}
.gal-track{display:flex;gap:1.8rem;padding:0 6rem;will-change:transform}
.gal-thumb{flex-shrink:0;width:370px;height:490px;overflow:hidden;position:relative}
.gal-thumb svg{width:100%;height:100%;display:block;transform:scale(1.04);transition:transform 1.8s cubic-bezier(.16,1,.3,1)}
.gal-thumb:hover svg{transform:scale(1.1)}
.gal-lbl{position:absolute;bottom:1.5rem;left:1.5rem;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(247,244,239,.65)}
.contact{background:var(--cream);color:var(--black);min-height:85vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:8rem 4rem;overflow:hidden}
.contact-inner{max-width:850px}
.contact-tag{font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--mid);margin-bottom:3.2rem;opacity:0;transform:translateY(18px)}
.contact-h2{font-family:var(--serif);font-size:clamp(4rem,8vw,8.5rem);font-weight:300;line-height:.92;letter-spacing:-.015em;margin-bottom:4rem;overflow:hidden;color:var(--black)}
.contact-hline{display:block;overflow:hidden}
.contact-word{display:inline-block;transform:translateY(105%)}
.contact-email{font-family:var(--serif);font-size:1.3rem;font-style:italic;color:var(--mid);margin-bottom:3.5rem;opacity:0;transform:translateY(18px)}
.contact-btn{display:inline-flex;align-items:center;gap:1.6rem;padding:1.1rem 3.2rem;border:1px solid var(--black);font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;color:var(--black);text-decoration:none;transition:all .9s cubic-bezier(.16,1,.3,1);opacity:0;transform:translateY(18px);cursor:none}
.contact-btn:hover{background:var(--black);color:var(--white)}
.contact-arrow{transition:transform .7s cubic-bezier(.16,1,.3,1)}
.contact-btn:hover .contact-arrow{transform:translateX(8px)}
.footer{background:var(--black);padding:3.2rem 6rem;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(255,255,255,.05)}
.footer-logo{font-family:var(--serif);font-size:.95rem;letter-spacing:.32em;text-transform:uppercase;color:var(--stone)}
.footer-copy{font-size:.6rem;letter-spacing:.1em;color:var(--mid)}
.footer-nav{display:flex;gap:2.2rem}
.footer-nav a{font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--mid);text-decoration:none;transition:color .4s}
.footer-nav a:hover{color:var(--white)}
</style>
</head>
<body>
<div id="cur"></div>
<div id="cur-ring"></div>
<div id="root"></div>
<script type="text/babel">
const { useEffect, useRef, useState } = React;
gsap.registerPlugin(ScrollTrigger);

const HeroBG = () => (
  <svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" style={{width:'100%',height:'120%',display:'block',position:'absolute',top:0,left:0}}>
    <defs>
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#c4beb0"/><stop offset="100%" stopColor="#e8e0d0"/></linearGradient>
      <linearGradient id="bldG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#323028"/><stop offset="100%" stopColor="#1a1814"/></linearGradient>
      <linearGradient id="glsG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#7a8a9a" stopOpacity=".55"/><stop offset="100%" stopColor="#4a5a6a" stopOpacity=".25"/></linearGradient>
    </defs>
    <rect width="1600" height="900" fill="url(#skyG)"/>
    <rect x="0" y="200" width="1600" height="700" fill="#e4dcd0"/>
    <rect x="0" y="755" width="1600" height="145" fill="#cec8bc"/>
    <rect x="460" y="170" width="680" height="585" fill="url(#bldG)"/>
    <rect x="470" y="180" width="660" height="565" fill="url(#glsG)"/>
    {[240,292,344,396,448,500,552,604,656,708].map(y=>(
      <line key={y} x1="470" y1={y} x2="1130" y2={y} stroke="#8a9aaa" strokeWidth=".5" opacity=".38"/>
    ))}
    {[538,608,678,748,818,888,958,1028,1098].map(x=>(
      <line key={x} x1={x} y1="180" x2={x} y2="755" stroke="#8a9aaa" strokeWidth=".5" opacity=".38"/>
    ))}
    <rect x="140" y="300" width="320" height="455" fill="#252220"/>
    <rect x="150" y="310" width="300" height="435" fill="#8090a0" opacity=".18"/>
    <rect x="1140" y="360" width="260" height="395" fill="#252220"/>
    <rect x="1150" y="370" width="240" height="375" fill="#8090a0" opacity=".14"/>
    <rect x="0" y="755" width="1600" height="8" fill="#b8b2a8"/>
  </svg>
);

const VisionSVG = () => (
  <svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" style={{width:'100%',height:'100%',display:'block'}}>
    <defs>
      <linearGradient id="intG2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#e8e0d0"/><stop offset="100%" stopColor="#d8d0c4"/></linearGradient>
    </defs>
    <rect width="800" height="1000" fill="url(#intG2)"/>
    <rect x="100" y="60" width="600" height="560" fill="#ddd6c8"/>
    <rect x="250" y="110" width="300" height="400" fill="#a0b2c4" opacity=".4"/>
    <line x1="400" y1="110" x2="400" y2="510" stroke="#90a0b2" strokeWidth="2"/>
    <line x1="250" y1="295" x2="550" y2="295" stroke="#90a0b2" strokeWidth="2"/>
    <rect x="20" y="145" width="760" height="14" fill="#c4beb2"/>
    <rect x="500" y="460" width="100" height="10" fill="#3a3530" rx="1"/>
    <rect x="505" y="355" width="9" height="115" fill="#3a3530"/>
    <rect x="586" y="355" width="9" height="115" fill="#3a3530"/>
    <rect x="505" y="355" width="90" height="62" fill="#5a5550" opacity=".8"/>
    <rect x="148" y="500" width="85" height="7" fill="#3a3530" rx="1"/>
    <rect x="168" y="507" width="7" height="110" fill="#3a3530"/>
    <rect x="219" y="507" width="7" height="110" fill="#3a3530"/>
    <ellipse cx="191" cy="500" rx="16" ry="5" fill="#6a6458"/>
    <rect x="184" y="438" width="14" height="62" fill="#6a6458" rx="7"/>
    <rect x="0" y="620" width="800" height="380" fill="#c4beb2"/>
  </svg>
);

const Cursor = () => {
  useEffect(()=>{
    const cur = document.getElementById('cur');
    const ring = document.getElementById('cur-ring');
    let mx=0,my=0,rx=0,ry=0;
    document.addEventListener('mousemove',e=>{
      mx=e.clientX;my=e.clientY;
      gsap.to(cur,{x:mx,y:my,duration:.08,ease:'none'});
    });
    const raf=()=>{rx+=(mx-rx)*.1;ry+=(my-ry)*.1;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(raf);}
    raf();
    const grow=()=>{gsap.to(cur,{width:58,height:58,duration:.45,ease:'power2.out'});gsap.to(ring,{opacity:0,duration:.3});};
    const shrink=()=>{gsap.to(cur,{width:9,height:9,duration:.45,ease:'power2.out'});gsap.to(ring,{opacity:1,duration:.3});};
    document.querySelectorAll('a,button,.proj-item,.gal-thumb').forEach(el=>{el.addEventListener('mouseenter',grow);el.addEventListener('mouseleave',shrink);});
  },[]);
  return null;
};

const Loader = ({onDone})=>{
  const logoRef=useRef();
  const barRef=useRef();
  const numRef=useRef();
  const wrapRef=useRef();
  useEffect(()=>{
    const tl=gsap.timeline({onComplete:onDone});
    tl.to(logoRef.current,{opacity:1,duration:1.3,ease:'power2.out'})
      .to(barRef.current,{width:'100%',duration:2.2,ease:'power2.inOut'},'-=.4')
      .to(numRef.current,{innerHTML:100,snap:{innerHTML:1},duration:2.2,ease:'power2.inOut'},'-=2.2')
      .to(logoRef.current,{opacity:0,y:-20,duration:.7,ease:'power2.in'},'-=.2')
      .to(wrapRef.current,{yPercent:-100,duration:1.5,ease:'power4.inOut'});
  },[]);
  return(
    <div className="loader" ref={wrapRef}>
      <div className="loader-logo" ref={logoRef}>Forma</div>
      <div className="loader-track"><div className="loader-fill" ref={barRef}/></div>
      <div className="loader-num" ref={numRef}>0</div>
    </div>
  );
};

const Nav = ({visible})=>{
  const ref=useRef();
  useEffect(()=>{
    if(visible) gsap.to(ref.current,{opacity:1,duration:1.2,ease:'power2.out',delay:.3});
  },[visible]);
  return(
    <nav className="nav" ref={ref}>
      <a href="#" className="nav-logo">Forma</a>
      <ul className="nav-links">
        {['Work','Studio','Process','Contact'].map(l=>(<li key={l}><a href="#">{l}</a></li>))}
      </ul>
      <button className="nav-cta">Enquire ↗</button>
    </nav>
  );
};

const Hero = ({active})=>{
  const bgRef=useRef();
  const contentRef=useRef();
  const eyeRef=useRef();
  const w1=useRef(),w2=useRef(),w3=useRef();
  const subRef=useRef();
  const scrollRef=useRef();
  useEffect(()=>{
    if(!active) return;
    const tl=gsap.timeline({delay:.25});
    tl.to(eyeRef.current,{opacity:1,y:0,duration:1.5,ease:'power3.out'})
      .to([w1.current,w2.current,w3.current],{y:'0%',opacity:1,duration:1.8,ease:'power4.out',stagger:.14},'-=.9')
      .to(subRef.current,{opacity:1,y:0,duration:1.3,ease:'power3.out'},'-=.9')
      .to(scrollRef.current,{opacity:1,duration:1,ease:'power2.out'},'-=.5');
    gsap.to(bgRef.current,{yPercent:-18,ease:'none',scrollTrigger:{trigger:'.hero',start:'top top',end:'bottom top',scrub:2}});
    gsap.to(contentRef.current,{yPercent:22,opacity:0,scale:.94,ease:'none',scrollTrigger:{trigger:'.hero',start:'25% top',end:'bottom top',scrub:1.4}});
  },[active]);
  return(
    <section className="hero">
      <div className="hero-bg" ref={bgRef}><HeroBG/></div>
      <div className="hero-overlay"/>
      <div className="hero-content" ref={contentRef}>
        <div className="hero-eyebrow" ref={eyeRef}>Architecture & Interior Design — Est. 2008</div>
        <h1 className="hero-h1">
          <span className="hero-line"><span className="hero-word" ref={w1}>Space</span></span>
          <span className="hero-line">
            <span className="hero-word" ref={w2} style={{marginLeft:'1.8em',fontStyle:'italic'}}>as</span>{' '}
            <span className="hero-word" ref={w3}>Language</span>
          </span>
        </h1>
        <p className="hero-sub" ref={subRef}>Crafting environments that transcend the ordinary</p>
      </div>
      <div className="hero-scroll" ref={scrollRef}>

const Philosophy = ()=>{
  const wrap=useRef();
  const phases=[
    {n:'01 — Discovery',t:<>Every great work<br/>begins with<br/><em>listening</em></>,b:'We immerse ourselves in context — land, culture, light, and the lives that will inhabit these spaces.'},
    {n:'02 — Vision',t:<>Architecture is<br/><em>frozen</em><br/>music</>,b:'We translate emotional resonance into structural form, composing space as a conductor composes sound.'},
    {n:'03 — Craft',t:<>Details are<br/>not details —<br/>they <em>are</em> the design</>,b:'Each material chosen with obsessive care, each threshold considered as a moment of arrival.'},
  ];
  const [active,setActive]=useState(0);
  const phaseRefs=[useRef(),useRef(),useRef()];
  useEffect(()=>{
    gsap.set(phaseRefs[0].current,{opacity:1,y:0});
    ScrollTrigger.create({
      trigger:wrap.current,start:'top top',end:'bottom bottom',scrub:true,
      onUpdate:self=>{
        const p=self.progress;
        const idx=p<.33?0:p<.66?1:2;
        setActive(idx);
        phaseRefs.forEach((r,i)=>{
          if(i===idx) gsap.to(r.current,{opacity:1,y:0,duration:.9,ease:'power3.out'});
          else gsap.to(r.current,{opacity:0,y:i<idx?-28:28,duration:.7,ease:'power3.in'});
        });
      }
    });
  },[]);
  return(
    <div className="pin-wrap" ref={wrap}>
      <div className="pin-sticky">
        {phases.map((ph,i)=>(
          <div className="pin-phase" ref={phaseRefs[i]} key={i}>
            <div className="pin-num">{ph.n}</div>
            <h3 className="pin-title">{ph.t}</h3>
            <p className="pin-body">{ph.b}</p>
          </div>
        ))}
        <div className="pin-dots">
          {phases.map((_,i)=><div className={`pin-dot${active===i?' on':''}`} key={i}/>)}
        </div>
      </div>
    </div>
  );
};

const Contact = ()=>{
  const sec=useRef();
  const tag=useRef();
  const words=[useRef(),useRef(),useRef(),useRef()];
  const email=useRef();
  const btn=useRef();
  useEffect(()=>{
    ScrollTrigger.create({trigger:sec.current,start:'top 68%',onEnter:()=>{
      gsap.to(tag.current,{opacity:1,y:0,duration:1.1,ease:'power3.out'});
      gsap.to(words.map(r=>r.current),{y:'0%',duration:1.8,ease:'power4.out',stagger:.15,delay:.2});
      gsap.to(email.current,{opacity:1,y:0,duration:1.2,ease:'power3.out',delay:.7});
      gsap.to(btn.current,{opacity:1,y:0,duration:1,ease:'power3.out',delay:.95});
    }});
    const b=btn.current;
    const onMove=e=>{const r=b.getBoundingClientRect();gsap.to(b,{x:(e.clientX-r.left-r.width/2)*.22,y:(e.clientY-r.top-r.height/2)*.22,duration:.7,ease:'power3.out'});};
    const onLeave=()=>gsap.to(b,{x:0,y:0,duration:.9,ease:'elastic.out(1,.4)'});
    b.addEventListener('mousemove',onMove);b.addEventListener('mouseleave',onLeave);
    return()=>{b.removeEventListener('mousemove',onMove);b.removeEventListener('mouseleave',onLeave);};
  },[]);
  return(
    <section className="contact" ref={sec}>
      <div className="contact-inner">
        <div className="contact-tag" ref={tag}>Start a Conversation</div>
        <h2 className="contact-h2">
          <span className="contact-hline"><span className="contact-word" ref={words[0]}>Let's</span>{' '}<span className="contact-word" ref={words[1]}>build</span></span>

  );
};
